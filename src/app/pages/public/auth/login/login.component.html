<div class="root-container">
    <div class="card">
        <h1>Lumino</h1>
        <form [formGroup]="form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" formControlName="email">
                <validation [form]="form" controlName="email" [validation]="{
                    'required': 'Email is required',
                    'maxLength': 'Email is 100 characters only'
                }"/> 
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" formControlName="password">
                <validation [form]="form" controlName="password" [validation]="{
                    'required': 'Password is required',
                }"/>
            </div>
            <button (click)="login()" type="submit" class="submit-btn">Log In</button>
        </form>
        <div>
            <p class="create-account">Don't have an account? <a routerLink="/register">Create an account.</a></p>
        </div>
           <div class="divider">
                <hr>
                <span>Or</span>
                <hr>
            </div>
            <div class="socials">
                <div class="icon-card">
                    <i class="pi pi-google"></i>
                </div>
                <div class="icon-card">
                    <i class="pi pi-facebook"></i>
                </div>
                <div class="icon-card">
                    <i class="pi pi-github"></i>
                </div>
            </div>
    </div>
</div>
